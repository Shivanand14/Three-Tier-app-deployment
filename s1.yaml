name: shiva ci workflow

on:
  push:

jobs:
  build and push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v4 # Note: v3 is currently the stable version for buildx

      - name: Push to DockerHub
      - uses: docker/build-push-action@v4
        