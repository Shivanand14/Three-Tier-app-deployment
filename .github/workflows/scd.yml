
name: Shiva CD Workflow
on:
  workflow_run:
    workflows: ["shiva ci workflow"]
    types: 
      - completed


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute remote SSH commands using password  #test added
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }} #secret use test add
          script: |
            git clone https://github.com/Shivanand14/Three-Tier-app-deployment.git
            cd ~/Three-Tier-app-deployment
            git pull origin main
            docker compose pull
            docker compose up -d 




          

      